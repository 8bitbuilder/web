<!-- ── Dropdown toggle script (no dependencies) ──────────── -->
<script>
// Hamburger menu toggle
function toggleMenu() {
  document.getElementById('navbarLinks').classList.toggle('show');
}

// Auth pill dropdown toggle
(function() {
  var authBtn = document.getElementById('authBtn');
  var authDropdown = document.getElementById('authDropdown');
  var authChevron = document.getElementById('authChevron');

  if (authBtn) {
    authBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      authDropdown.classList.toggle('show');
      authChevron.classList.toggle('open');
    });
  }

  // Close dropdown when clicking anywhere else on the page
  document.addEventListener('click', function(e) {
    if (authDropdown && !authDropdown.contains(e.target) && !authBtn.contains(e.target)) {
      authDropdown.classList.remove('show');
      authChevron.classList.remove('open');
    }
  });
})();
</script>
