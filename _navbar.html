<!-- ── Dropdown toggle script (no dependencies) ──────────── -->
<script>
(function() {
  // Hamburger menu toggle
  var navToggle = document.getElementById('navToggleBtn');
  if (navToggle) {
    navToggle.addEventListener('click', function() {
      document.getElementById('navbarLinks').classList.toggle('show');
    });
  }

  // Logged-out dropdown
  var authBtnOut = document.getElementById('authBtnOut');
  var dropdownMenuOut = document.getElementById('dropdownMenuOut');
  var chevronOut = document.getElementById('chevronOut');

  if (authBtnOut) {
    authBtnOut.addEventListener('click', function(e) {
      e.stopPropagation();
      if (dropdownMenuIn) dropdownMenuIn.classList.remove('show');
      if (chevronIn) chevronIn.classList.remove('open');
      dropdownMenuOut.classList.toggle('show');
      chevronOut.classList.toggle('open');
    });
  }

  // Logged-in dropdown
  var authBtnIn = document.getElementById('authBtnIn');
  var dropdownMenuIn = document.getElementById('dropdownMenuIn');
  var chevronIn = document.getElementById('chevronIn');

  if (authBtnIn) {
    authBtnIn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (dropdownMenuOut) dropdownMenuOut.classList.remove('show');
      if (chevronOut) chevronOut.classList.remove('open');
      dropdownMenuIn.classList.toggle('show');
      chevronIn.classList.toggle('open');
    });
  }

  // Close all dropdowns when clicking anywhere else
  document.addEventListener('click', function() {
    if (dropdownMenuOut) dropdownMenuOut.classList.remove('show');
    if (chevronOut) chevronOut.classList.remove('open');
    if (dropdownMenuIn) dropdownMenuIn.classList.remove('show');
    if (chevronIn) chevronIn.classList.remove('open');
  });

  // Guest link handler (in logged-out dropdown)
  var navGuestLink = document.getElementById('navGuestLink');
  if (navGuestLink) {
    navGuestLink.addEventListener('click', function(e) {
      e.preventDefault();
      sessionStorage.setItem('aaic_guest', 'true');
      window.location.href = 'guest-hub.html';
    });
  }

  // Log Out handler
  var logOutLink = document.getElementById('navLogOutLink');
  if (logOutLink) {
    logOutLink.addEventListener('click', function(e) {
      e.preventDefault();
      // Clear guest flag
      sessionStorage.removeItem('aaic_guest');
      if (typeof _supabase !== 'undefined' && _supabase) {
        _supabase.auth.signOut().then(function() {
          window.location.href = '/';
        });
      } else {
        window.location.href = '/';
      }
    });
  }
})();
</script>

<!-- ── Supabase + Auth (loads after dropdown is already working) ── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<!-- ── Auth state check (runs after Supabase is loaded) ────────── -->
<script>
(function() {
  function showModulesLink() {
    var link = document.getElementById('navModulesLink');
    var sep = document.getElementById('navModulesSeparator');
    if (link) link.style.display = '';
    if (sep) sep.style.display = '';
  }

  function switchToLoggedIn(displayName, role) {
    var loggedOutEl = document.getElementById('authDropdownLoggedOut');
    var loggedInEl = document.getElementById('authDropdownLoggedIn');
    var navUsername = document.getElementById('navUsername');
    var navDashboardLink = document.getElementById('navDashboardLink');

    if (loggedOutEl) loggedOutEl.classList.add('hidden');
    if (loggedInEl) loggedInEl.classList.remove('hidden');
    if (navUsername) navUsername.textContent = displayName;

    if (navDashboardLink) {
      navDashboardLink.style.display = (role === 'teacher') ? 'block' : 'none';
    }

    showModulesLink();
  }

  function checkAuthState() {
    // Check guest mode first
    var isGuest = sessionStorage.getItem('aaic_guest') === 'true';
    if (isGuest) {
      switchToLoggedIn('Guest', 'guest');
      return;
    }

    if (typeof _supabase === 'undefined' || !_supabase) {
      setTimeout(checkAuthState, 200);
      return;
    }

    _supabase.auth.getSession().then(function(result) {
      var session = result.data.session;

      if (session && session.user) {
        _supabase
          .from('profiles')
          .select('username, role')
          .eq('id', session.user.id)
          .single()
          .then(function(profileResult) {
            var profile = profileResult.data;
            if (profile) {
              switchToLoggedIn(profile.username, profile.role);
            }
          });
      }
      // If not logged in, leave in logged-out state (default)
    });
  }

  checkAuthState();
  document.addEventListener('DOMContentLoaded', checkAuthState);
})();
</script>
