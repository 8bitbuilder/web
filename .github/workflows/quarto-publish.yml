name: Render and Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install handoutWithNotes
        run: |
          TEXMFHOME=$(/home/runner/.TinyTeX/bin/x86_64-linux/kpsewhich -var-value TEXMFHOME)
          mkdir -p "$TEXMFHOME/tex/latex/handoutwithnotes"
          curl -L "https://raw.githubusercontent.com/noamsgl/latex-msc-thesis-slides/main/handoutWithNotes.sty" \
            -o "$TEXMFHOME/tex/latex/handoutwithnotes/handoutWithNotes.sty"
          /home/runner/.TinyTeX/bin/x86_64-linux/mktexlsr

      - name: Update TeX Live manager and install LaTeX packages
        run: |
          TLMGR=/home/runner/.TinyTeX/bin/x86_64-linux/tlmgr
          "$TLMGR" update --self
          "$TLMGR" install luatexbase

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbformat nbclient ipykernel pandas numpy matplotlib
      
      - name: Render Quarto Project
        run: |
          # Render the main site
          quarto render
          
          # Create the modules directory in the output
          mkdir -p _site/modules/water-quality

          # Render the water-quality module separately with its own config
          cd modules/water-quality
          quarto render

          # ALSO RENDER SLIDES EXPLICITLY (new addition)
          find . -name "slides.qmd" -exec quarto render {} --to revealjs \;
          
          # Copy the rendered module output to the main site output
          cp -r _site/* ../../_site/modules/water-quality/
          cd ../..
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
